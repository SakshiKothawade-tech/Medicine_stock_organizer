{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h1>
        {% if medicine %}
            Edit Medicine
        {% else %}
            Add New Medicine
        {% endif %}
    </h1>


    <form method="POST">

        <label>Medicine Name</label>

        <input type="text"
               name="name"
               value="{{ medicine.name if medicine else '' }}"
               required>


        <label>Category</label>

        <select name="category">

            <option>Tablet</option>
            <option>Capsule</option>
            <option>Syrup</option>
            <option>Injection</option>
            <option>Ointment</option>
            <option>Drops</option>
            <option>Other</option>

        </select>


        <label>Quantity</label>

        <input type="number"
               name="quantity"
               min="0"
               value="{{ medicine.quantity if medicine else 0 }}"
               required>


        <label>Price</label>

        <input type="number"
               name="price"
               min="0"
               step="0.01"
               value="{{ medicine.price if medicine else 0 }}"
               required>


        <label>Expiry Date</label>

        <input type="date"
               name="expiry_date"
               value="{{ medicine.expiry_date if medicine else '' }}"
               required>


        <label>Supplier</label>

        <input type="text"
               name="supplier"
               value="{{ medicine.supplier if medicine else '' }}">


        <button type="submit">
            Save Medicine
        </button>

    </form>

</div>

{% endblock %}
